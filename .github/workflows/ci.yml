name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      # No real Clerk keys are configured in CI (see .env.example) -- the
      # build only statically analyzes/prerenders routes, and /account is a
      # dynamic (server-rendered) route, so `next build` doesn't need a real
      # publishableKey to succeed. Runtime behavior against real Clerk is
      # not exercised here.
      - run: npm run build
      # Must run AFTER build, not before: LayoutProps and other route types
      # are generated by Next.js itself (into .next/types/) as part of
      # `next build`/`next dev` -- a bare `tsc --noEmit` on a fresh checkout
      # with no prior build fails with "Cannot find name 'LayoutProps'".
      # Confirmed locally: passes with a stale .next/ from earlier local
      # builds, fails on `rm -rf .next && npx tsc --noEmit` -- exactly what
      # a fresh CI checkout does, which is how this was caught.
      - run: npx tsc --noEmit

      - name: Notify Telegram
        if: always()
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Status: ${{ job.status == 'success' && '🟢 SUCCESS' || job.status == 'cancelled' && '🟡 CANCELLED' || '🔴 FAILURE' }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
